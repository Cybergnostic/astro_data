name: Calculation audit

on:
  push:
    branches:
      - fix/calculation-audit
    paths-ignore:
      - .calculation-audit-result.txt

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SWISSEPH_EPHE: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calculation-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: pip install -e .

      - name: Run tests and record result
        shell: bash
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.out 2>&1
          code=$?
          {
            echo "exit_code=$code"
            echo "commit=$(git rev-parse HEAD)"
            cat /tmp/pytest.out
          } > .calculation-audit-result.txt
          cat .calculation-audit-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .calculation-audit-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record calculation audit result"
            git push
          fi

          exit 0
