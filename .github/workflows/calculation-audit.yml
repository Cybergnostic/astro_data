name: Calculation audit tests

on:
  push:
    branches:
      - fix/calculation-audit
    paths-ignore:
      - '.calculation-audit-result.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SWISSEPH_EPHE: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calculation-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests and record result
        id: tests
        shell: bash
        run: |
          set +e
          pytest -q > /tmp/pytest-output.txt 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo "commit=${GITHUB_SHA}"
            echo "--- pytest ---"
            cat /tmp/pytest-output.txt
          } > .calculation-audit-result.txt
          exit 0
      - name: Publish result on audit branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .calculation-audit-result.txt
          git commit -m "[ci-result] calculation audit pytest" || exit 0
          git push origin HEAD:fix/calculation-audit
