name: Extract relationship renderer

on:
  push:
    branches:
      - engineering-hardening
    paths:
      - .github/workflows/extract-almuten-renderer.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      SWISSEPH_EPHE: /tmp

    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Remove migrated relationship renderer block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hor_tools/output.py")
          text = path.read_text()

          old_import = "from .rendering.almuten import print_almuten_tables\n"
          new_import = (
              "from .rendering.almuten import print_almuten_tables\n"
              "from .rendering.relationships import render_relationship_tables as _render_relationship_tables\n"
          )
          if old_import not in text:
              raise SystemExit("Expected rendering import not found in output.py")
          text = text.replace(old_import, new_import, 1)

          start = text.index("def _format_contrib_cell(")
          end = text.index("def _format_long_with_sign(", start)
          text = text[:start] + text[end:]

          # These annotations moved with the relationship renderer.
          text = text.replace("InfluenceSource, ", "")
          path.write_text(text)
          PY

      - name: Verify extraction
        shell: bash
        run: |
          uv sync --all-groups
          uv run pytest -q
          uv run ruff check hor_tools tests scan_events.py asc_window_scan.py
          uv build

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hor_tools/output.py
          git commit -m "Extract relationship renderer from output module"
          git push
