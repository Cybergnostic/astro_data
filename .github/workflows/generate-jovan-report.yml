name: Generate Jovan report

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-jovan-report.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install project
        run: uv sync --all-groups
      - name: Generate Jovan Markdown report
        env:
          SWISSEPH_EPHE: /tmp
        run: |
          cp tests/fixtures/sample_nis.hor /tmp/jovan.hor
          sed -i '1s/^VSample$/VJovan/' /tmp/jovan.hor
          uv run hor-reader /tmp/jovan.hor --md jovan.md
          test -s outputs/jovan.md
      - name: Commit generated report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/jovan.md
          git commit -m 'Add generated Jovan natal technical report'
          git push origin HEAD:main
