name: Refresh README preview

on:
  push:
    paths:
      - .github/workflows/refresh-readme-preview.yml

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Render fictional example report preview
        run: |
          mkdir -p docs/img
          cat > /tmp/example.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><style>
          :root{--bg:#f5f1e8;--paper:#fffdf8;--ink:#292722;--muted:#6d675c;--line:#ded5c7;--accent:#795f3d;--soft:#eee6d8}
          *{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);width:1400px;min-height:920px;margin:0 auto;background:var(--paper)}.side{padding:28px 18px;border-right:1px solid var(--line);background:#eee8dd}.side strong{display:block;font-size:19px;margin-bottom:18px}.side a{display:block;text-decoration:none;padding:5px 0;color:#544b40;font-family:system-ui,sans-serif;font-size:13px}.report{padding:48px 56px;min-width:0}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font:600 12px system-ui,sans-serif;color:var(--accent)}h1{font-size:38px;margin:0 0 7px}.subtitle{color:var(--muted);margin-top:0}.snapshot{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin:28px 0 34px}.card{border:1px solid var(--line);background:#fff;padding:15px;border-radius:8px;min-height:89px}.card small{display:block;font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.card b{font-size:17px}.card div{font-size:13px;color:var(--muted);margin-top:3px}h2{font-size:26px;margin:37px 0 15px;padding-bottom:7px;border-bottom:1px solid var(--line)}.table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:7px;background:#fff}table{border-collapse:collapse;width:100%;font-family:system-ui,sans-serif;font-size:13px}th{text-align:left;background:var(--soft);font-size:12px}th,td{padding:9px 11px;border-bottom:1px solid #eee7dc;vertical-align:top}.pill{display:inline-block;background:var(--soft);padding:2px 7px;border-radius:999px;font:600 11px system-ui,sans-serif}.footer{margin-top:18px;color:var(--muted);font:12px system-ui,sans-serif}
          </style></head><body><div class="layout"><nav class="side"><strong>Example Chart<br>Natal Report</strong><a>Chart frame</a><a>Planets</a><a>Houses</a><a>Relationships</a><a>Lots</a><a>Temperament</a><a>Primary motivation</a><a>Behaviour</a><a>Quality of mind</a><a>Duads</a><a>Almuten Figuris</a></nav><main class="report">
          <div class="eyebrow">Traditional astrology · technical worksheet</div><h1>Natal Technical Report</h1><p class="subtitle">Example Chart · fictional data · generated by hor-tools</p>
          <section class="snapshot"><div class="card"><small>Sect</small><b>Day</b><div>Venus day · Mercury hour</div></div><div class="card"><small>Ascendant</small><b>14°22′ Libra</b><div>MC 18°07′ Cancer</div></div><div class="card"><small>Fortune / Spirit</small><b>08°41′ Taurus</b><div>Spirit 20°03′ Aquarius</div></div><div class="card"><small>Temperament</small><b>K 2 · S 5 · M 3 · F 2</b><div>Sanguine dominant</div></div><div class="card"><small>Almuten Figuris</small><b>Venus</b><div>score 39</div></div><div class="card"><small>Ruler of behaviour</small><b>Mercury</b><div>secondary Venus</div></div><div class="card"><small>Prenatal syzygy</small><b>27°19′ Pisces</b></div><div class="card"><small>House system</small><b>Whole Sign</b><div>Tropical zodiac</div></div></section>
          <h2>1. Chart frame</h2><div class="table-wrap"><table><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Location</td><td>Fictional example</td></tr><tr><td>Sect</td><td>Day</td></tr><tr><td>Planetary day / hour</td><td>Venus / Mercury</td></tr><tr><td>Ascendant / MC</td><td>14°22′ Libra / 18°07′ Cancer</td></tr></tbody></table></div>
          <h2>2. Planets</h2><div class="table-wrap"><table><thead><tr><th>Planet</th><th>Position</th><th>H</th><th>Condition</th><th>Phase</th></tr></thead><tbody><tr><td>Sun</td><td>09°17′ Leo</td><td>11</td><td><span class="pill">sect</span> domicile ruler Sun</td><td>—</td></tr><tr><td>Moon</td><td>03°42′ Sagittarius</td><td>3</td><td>swift</td><td>Waxing crescent</td></tr><tr><td>Mercury</td><td>16°05′ Virgo</td><td>12</td><td><span class="pill">dom</span> <span class="pill">exalt</span></td><td>Oriental</td></tr><tr><td>Venus</td><td>12°51′ Libra</td><td>1</td><td><span class="pill">dom</span> angular</td><td>Occidental</td></tr><tr><td>Mars</td><td>25°11′ Gemini</td><td>9</td><td>direct</td><td>Oriental</td></tr><tr><td>Jupiter</td><td>06°28′ Pisces</td><td>6</td><td><span class="pill">dom</span></td><td>Strong easternization</td></tr><tr><td>Saturn</td><td>19°36′ Capricorn</td><td>4</td><td><span class="pill">dom</span> sect</td><td>Direct</td></tr></tbody></table></div>
          <p class="footer">Illustrative fictional chart. Preview shows the current HTML report layout.</p></main></div></body></html>
          HTML
          cat > /tmp/screenshot.py <<'PY'
          from playwright.sync_api import sync_playwright
          html = open('/tmp/example.html', encoding='utf-8').read()
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1400, "height": 920})
              page.set_content(html)
              page.screenshot(path='docs/img/report_example.png')
              browser.close()
          PY
          python /tmp/screenshot.py

      - name: Commit preview
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/img/report_example.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: add current HTML report preview"
          git push
