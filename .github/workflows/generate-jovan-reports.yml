name: Generate Jovan reports

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-jovan-reports.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install project
        run: uv sync --all-groups
      - name: Generate polished Jovan reports
        env:
          SWISSEPH_EPHE: /tmp
        run: |
          cp tests/fixtures/sample_nis.hor /tmp/jovan.hor
          sed -i '1s/^VSample$/VJovan/' /tmp/jovan.hor
          uv run hor-reader /tmp/jovan.hor --md jovan.md --html jovan.html
          test -s outputs/jovan.md
          test -s outputs/jovan.html
          grep -q 'At a glance' outputs/jovan.md
          grep -q '<!doctype html>' outputs/jovan.html
      - name: Commit generated reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/jovan.md outputs/jovan.html
          if git diff --cached --quiet; then
            echo 'Reports unchanged.'
            exit 0
          fi
          git commit -m 'Regenerate polished Jovan reports'
          git push origin HEAD:main
